[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --tb=short"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests load a hyphenated Hermes plugin directory as a package by importlib spec.
"tests/test_mirror.py" = ["E402"]
