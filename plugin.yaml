name: telegram-mirror
version: "0.3.4"
description: "Live two-way mirror of a profile's canonical Bot Chat into a dedicated Telegram bot: typing, interim messages, redacted tool cards and Telegram HTML."
author: PatroniousGrendopolies
provides_tools: []
provides_hooks:
  - pre_llm_call
  - on_stream_start
  - on_interim_message
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - agent_loop_stopped
